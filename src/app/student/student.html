@for (item of students; track $index) {
   <!--<p [ngClass]="{'absent': !item.present}"
       [ngStyle]="{'background-color': item.gender === 'F' ? F_COLOR : M_COLOR}"> --> 
       <p [ngStyle]="getStyle(item)">

        @if (item.present) {
            <span>presente</span>
        } @else {
            <span style="text-transform: uppercase;">assente</span>
        }
    </p>
}
